name: test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Anki ${{ matrix.anki-version }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - anki-version: "24.04"
            tox-env: test-anki2404
            python-version: "3.9"
          - anki-version: "26.09.4"
            tox-env: test-anki2609
            python-version: "3.13"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Tox
        run: python -m pip install tox

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libcups2t64 libdbus-1-3 libegl1 libfontconfig1 \
            libgl1 libglib2.0-0t64 libharfbuzz0b libnss3 libpango-1.0-0 \
            libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxcomposite1 libxdamage1 libxfixes3 \
            libxi6 libxkbcommon-x11-0 libxkbcommon0 libxkbfile1 libxrandr2 \
            libxrender1 libxtst6 xauth xvfb

      # NOTE: The add-on's vendored pynput connects to X11 on import, like on a
      # real Linux desktop. xvfb provides a virtual display.
      - name: Run tests
        run: xvfb-run -a tox -e ${{ matrix.tox-env }}
