name: mypy

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    name: Mypy (Anki ${{ matrix.anki-version }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - anki-version: "24.04"
            tox-env: mypy-anki2404
            python-version: "3.9"
          - anki-version: "26.09.4"
            tox-env: mypy-anki2609
            python-version: "3.13"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Tox
        run: python -m pip install tox

      - name: Run Mypy
        run: tox -e ${{ matrix.tox-env }}
