[tox]
envlist =
    check-black,
    check-isort,
    {mypy,test}-{anki2404,anki2609},
ignore_basepython_conflict = true

[testenv]
basepython = {env:TOXPYTHON:python3.11}
setenv =
    PYTHONPATH = {toxinidir}/src{:}{toxinidir}/src/vendors{:}{env:PYTHONPATH:}
    QT_QPA_PLATFORM = offscreen
    # NOTE: Without this, the first import of a freshly installed Anki can crash on Windows.
    UV_COMPILE_BYTECODE = 1
passenv =
    *
usedevelop = false
skip_install = true

[testenv:check-black]
deps =
    black
commands =
    python -m black --diff --check src tests

[testenv:check-isort]
deps =
    isort
commands =
    python -m isort --profile black --verbose --check-only --diff src tests

[testenv:black]
deps =
    black
commands =
    python -m black src tests

[testenv:isort]
deps =
    isort
commands =
    python -m isort --profile black src tests

# The add-on is supported on, and tested against, each Anki version below
# (see AGENTS.md). Each one needs its own Python and its own PyQt6.
#
# NOTE: PyQt6 is pinned to what each Anki release bundles. The newest PyQt6 type
# stubs are broken (e.g. ``QWidget(parent: Self)``) and give false mypy errors.
#
[testenv:{mypy,test}-{anki2404,anki2609}]
basepython =
    anki2404: {env:TOXPYTHON:python3.9}
    anki2609: {env:TOXPYTHON:python3.13}
deps =
    anki2404: anki==24.4
    anki2404: aqt[qt6]==24.4
    anki2404: PyQt6==6.6.1
    anki2404: PyQt6-Qt6==6.6.2
    anki2404: PyQt6-WebEngine==6.6.0
    anki2404: PyQt6-WebEngine-Qt6==6.6.2
    anki2609: anki==26.9.4
    anki2609: aqt==26.9.4
    anki2609: PyQt6==6.11.0
    anki2609: PyQt6-Qt6==6.11.2
    anki2609: PyQt6-WebEngine==6.11.0
    anki2609: PyQt6-WebEngine-Qt6==6.11.2
    mypy: mypy
    mypy: types-beautifulsoup4>=4.12,<5
    mypy: types-pynput>=1.8.1,<2
    mypy: types-requests>=2.23,<3
commands =
    mypy: python -m mypy --strict src
    # NOTE: tests/test_gui.py boots a whole Anki and blocks forever, so it is
    # intentionally not run here.
    test: python -m unittest -v tests.test_smoke tests.test_editor_compat tests.test_send_definition tests.test_custom_profile tests.test_boot
